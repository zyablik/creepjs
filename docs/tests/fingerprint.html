        // fps via requestAnimationFrame
        function get_fps() {
          return new Promise((resolve) => {
            let done = false;
            const frameTimes = [];
            const finish = (timeout = false) => {
              if (done) return;
              done = true;
              if (!frameTimes.length) {
                resolve({ frames: 0, error: timeout ? 'timeout' : 'no frames' });
                return;
              }
              const sortedSamples = [...frameTimes].sort((a, b) => a - b);
              const trimmedSamples = sortedSamples.length > 2 ? sortedSamples.slice(1, -1) : sortedSamples;
              const sum = trimmedSamples.reduce((a, b) => a + b, 0);
              const avg = sum / trimmedSamples.length;
              const mid = Math.floor(trimmedSamples.length / 2);
              const median = trimmedSamples.length % 2
                ? trimmedSamples[mid]
                : (trimmedSamples[mid - 1] + trimmedSamples[mid]) / 2;
              resolve({
                frames: frameTimes.length,
                avgFrameTime: +avg.toFixed(2),
                medianFrameTime: +median.toFixed(2),
                minFrameTime: +trimmedSamples[0].toFixed(2),
                maxFrameTime: +trimmedSamples[trimmedSamples.length - 1].toFixed(2),
                avgFps: Math.round(1000 / avg),
                medianFps: Math.round(1000 / median),
                ...(timeout ? { error: 'timeout' } : {}),
              });
            };
            let prev = performance.now();
            const timeoutId = setTimeout(() => finish(true), 2000);
            const measure = (now) => {
              if (done) return;
              frameTimes.push(now - prev);
              prev = now;
              if (frameTimes.length < 20) {
                requestAnimationFrame(measure);
              } else {
                clearTimeout(timeoutId);
                finish(false);
              }
            };
            requestAnimationFrame(measure);
          });
        }

          async function fallback_fp(cause, timeoutMs = 500) {
            const fallback = {
              browser: { name: 'unknown', version: 'unknown' },
              platform: { name: 'unknown', version: 'unknown' },
              model: 'unknown',
              arch: 'unknown',
              fallback_error: {
                name: cause?.name || null,
                message: cause?.message || null,
                stack: cause?.stack || null,
              },
            };

            try {
              const nav = window.navigator || navigator;
              const ua = (nav.userAgent || '').toLowerCase();

              // 1. Синхронное наполнение (база из User-Agent)
              const browserMatch = ua.match(/(opera|edge|edg|opr|chrome|safari|firefox|msie|trident(?=\/))\/?\s*(\d+)/i) || [];
              if (browserMatch[1] === 'chrome') {
                const edgeOpr = ua.match(/(edg|opr|edge)\/(\d+)/i);
                fallback.browser = edgeOpr
                  ? { name: edgeOpr[1].replace('opr', 'opera').replace('edg', 'edge'), version: edgeOpr[2] }
                  : { name: 'chrome', version: browserMatch[2] };
              } else {
                fallback.browser = { name: browserMatch[1] || 'unknown', version: browserMatch[2] || 'unknown' };
              }

              // Грубая попытка определить архитектуру до асинхронного вызова
              if (ua.includes('x64') || ua.includes('wow64') || ua.includes('x86_64')) {
                fallback.arch = 'x86_64';
              } else if (ua.includes('arm') || ua.includes('aarch64')) {
                fallback.arch = 'arm';
              }

              // 2. Асинхронное уточнение (High Entropy UACH)
              if (nav.userAgentData && typeof nav.userAgentData.getHighEntropyValues === 'function') {
                const timeout = new Promise((_, reject) =>
                  setTimeout(() => reject(new Error('UACH Timeout')), timeoutMs));

                const uachPromise = nav.userAgentData.getHighEntropyValues([
                  'architecture',
                  'model',
                  'platformVersion',
                  'fullVersionList',
                  'bitness'
                ]);

                const uad = await Promise.race([uachPromise, timeout]);

                // Уточняем версию браузера (fullVersionList точнее, чем UA)
                if (uad.fullVersionList) {
                  const brand = uad.fullVersionList.find(b => !/Not.*Brand/i.test(b.brand));
                  if (brand) {
                    fallback.browser.name = brand.brand.toLowerCase().split(' ').pop();
                    fallback.browser.version = brand.version;
                  }
                }

                // Платформа и её реальная версия (важно для Win 10 vs 11)
                if (uad.platform)
                  fallback.platform.name = uad.platform.toLowerCase();

                if (uad.platformVersion)
                  fallback.platform.version = uad.platformVersion;

                // Модель и честная архитектура
                if (uad.model)
                  fallback.model = uad.model;

                if (uad.architecture) {
                  const bitness = uad.bitness ? ` (x${uad.bitness})` : '';
                  fallback.arch = uad.architecture.toLowerCase() + bitness;
                }
              }

              // 3. Финальные проверки платформы, если всё выше не сработало
              if (fallback.platform.name === 'unknown') {
                if (ua.includes('android')) {
                  fallback.platform.name = 'android';
                  fallback.platform.version = (ua.match(/android\s([0-9\.]+)/) || [])[1] || 'unknown';
                } else if (ua.includes('iphone') || ua.includes('ipad')) {
                  fallback.platform.name = 'ios';
                } else if (nav.platform) {
                  fallback.platform.name = nav.platform.toLowerCase();
                }
              }
            } catch (e) {
              // Если всё упало (например, из-за Proxy в fp), возвращаем что есть + ошибку
              fallback._error = e.message;
            }

            return fallback;
          }

          return fallback_fp(e);
        }

          fp.webgl.extensions_gl1.map((ext, i) => `<tr><td>[${i}] ${ext}</td></tr>`).join('')
        );

        const astats = Object.values(fp.audioCodecs).reduce((acc, v) => (acc[v]++, acc), {probably: 0, maybe: 0});

        str += details(
          `audio.canPlayType(): ${Object.keys(fp.audioCodecs).length} probably: ${astats.probably}, maybe: ${astats.maybe}`,
          Object.entries(fp.audioCodecs).map(([k, v], i) =>
            `<tr><td>[${i}] ${k}: </td><td>${JSON.stringify(v)}</td></tr>`).join(''));


        const vstats = Object.values(fp.videoCodecs).reduce((acc, v) => (acc[v]++, acc), {probably: 0, maybe: 0});

        str += details(
          `video.canPlayType(): ${Object.keys(fp.videoCodecs).length} probably: ${vstats.probably}, maybe: ${vstats.maybe}`,
          Object.entries(fp.videoCodecs).map(([k, v], i) =>
            `<tr><td>[${i}] ${k}: </td><td>${JSON.stringify(v)}</td></tr>`).join(''));

        str += details(
          `MediaSource.isTypeSupported(): ${fp.mediaSourceCodecs.length}`,
          fp.mediaSourceCodecs.map((codec, i) =>
            `<tr><td>[${i}]</td><td>${codec}</td></tr>`
          ).join('')
        );

        str += details(
          `MediaRecorder.isTypeSupported(): ${fp.mediaRecoderCodecs.length}`,
          fp.mediaRecoderCodecs.map((codec, i) =>
            `<tr><td>[${i}]</td><td>${codec}</td></tr>`
          ).join('')
        );

        str += "</table>"

        // fonts_debug is { label: the local() name that resolved }, so the table says
        // which alias hit -- a wrong name in FONT_ALIASES shows up as a missing row.
        let fonts_str = "<table border=1><tr><th>Font</th><th>matched local() name</th></tr>";
        const fonts_debug_entries = Object.entries(fp.fonts_debug || {}).sort(([a], [b]) => a.localeCompare(b));

        for (const [font, matched] of fonts_debug_entries) {
          fonts_str +=
            `<tr style="background:#cdffd8">
              <td style="font-family:'${font}'">${font}</td>
              <td>${matched}</td>
            </tr>`;
        }
        fonts_str += '</table>';

        str += details(`Fonts: ${fonts_debug_entries.length}`, fonts_str, true);

        content.innerHTML = str

        // Two canvases drawn by the SAME probe: differing hashes mean the canvas noise
        // is per-element random instead of seeded, and the prev/current pair catches
        // noise that is not stable across reloads. Both must equal fp.canvas2d_hash.
        let fingerprint1 = collectCanvas2dHash(document.getElementById("canvas_1"));
        let prev_fingerprint1_hash = localStorage.getItem("canvasFingerprint1");
        localStorage.setItem("canvasFingerprint1", fingerprint1);

        let fingerprint2 = collectCanvas2dHash(document.getElementById("canvas_2"));
        let prev_fingerprint2_hash = localStorage.getItem("canvasFingerprint2");
        localStorage.setItem("canvasFingerprint2", fingerprint2);

        document.getElementById("hash_1").innerHTML = `current hash = ${fingerprint1} prev hash = ${prev_fingerprint1_hash}`
        document.getElementById("hash_2").innerHTML = `current hash = ${fingerprint2} prev hash = ${prev_fingerprint2_hash}`

        if (fp.ya.tmgrdfrend_2d_fjordbank.dataurl) {
          document.getElementById("fjordbank_img").src = fp.ya.tmgrdfrend_2d_fjordbank.dataurl;
        }
        document.getElementById("fjordbank_hash").innerHTML = `hash = ${fp.ya.tmgrdfrend_2d_fjordbank.hash}`

        if (fp.ya.tmgrdfrend_3d_triangle.dataurl) {
          document.getElementById("tmgrdfrend_triangle_img").src = fp.ya.tmgrdfrend_3d_triangle.dataurl;
        }
        document.getElementById("tmgrdfrend_triangle_hash_cell").innerHTML = `hash = ${fp.ya.tmgrdfrend_3d_triangle.hash}`

        // Same pairing for WebGL; both must equal fp.canvas3d_hash.
        let fingerprint3 = collectCanvas3dHash(document.getElementById("canvas_3"));
        let prev_fingerprint3_hash = localStorage.getItem("canvasFingerprint3");
        localStorage.setItem("canvasFingerprint3", fingerprint3);

        let fingerprint4 = collectCanvas3dHash(document.getElementById("canvas_4"));
        let prev_fingerprint4_hash = localStorage.getItem("canvasFingerprint4");
        localStorage.setItem("canvasFingerprint4", fingerprint4);

        document.getElementById("hash_3").innerHTML = `current hash = ${fingerprint3} prev hash = ${prev_fingerprint3_hash}`
        document.getElementById("hash_4").innerHTML = `current hash = ${fingerprint4} prev hash = ${prev_fingerprint4_hash}`

      });

      const hashMini = (x) => {
        const json = `${JSON.stringify(x)}`
        const hash = json.split('').reduce((hash, char, i) => {
          return Math.imul(31, hash) + json.charCodeAt(i) | 0
        }, 0x811c9dc5)
        return ('0000000' + (hash >>> 0).toString(16)).substr(-8)
      }



    </script>
  </head>
  <body>
    <button id="save-fingerprint-btn" type="button" disabled>сохранить fingerprint</button>
    <p id=content></p>
    <canvas id=canvas> </canvas>
  </body>
</html>
